name: Measure Operators

on:
  workflow_dispatch:
    inputs:
      operator:
        description: "Operator to measure"
        required: true
        type: choice
        options:
          - MTS
          - MegaFon
          - T2
          - Beeline
          - Yota
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: measurements
  cancel-in-progress: false

jobs:
  measure:
    if: github.event_name == 'schedule' || matrix.operator == inputs.operator
    strategy:
      fail-fast: false
      matrix:
        operator: [MTS, MegaFon, T2, Beeline, Yota]
    runs-on: [self-hosted, windows, "${{ matrix.operator }}"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run measurement
        shell: pwsh
        env:
          OPERATOR: ${{ matrix.operator }}
        run: |
          ./tests/run-operator.ps1 -Operator $env:OPERATOR

      - name: Commit measurement results
        shell: pwsh
        env:
          OPERATOR: ${{ matrix.operator }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if (git diff --cached --quiet) {
            Write-Host "No measurement changes to commit."
            exit 0
          }
          git commit -m "Update $env:OPERATOR measurement"
          git push origin HEAD:main
