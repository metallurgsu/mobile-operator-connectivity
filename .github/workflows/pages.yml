name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/dashboard _site/data
          cp dashboard/index.html dashboard/dashboard.js _site/dashboard/
          cp data/*.json _site/data/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0; url=./dashboard/">
          <title>Mobile Operator Connectivity</title>
          </head>
          <body><a href="./dashboard/">Mobile Operator Connectivity</a></body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
